# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest]
        # macos-latest dropped 2026-06-19: macOS runner minutes exhausted -> ci.yml
        # startup_failure blocked merges; ubuntu covers the matrix. Restore when available.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3.5.0

      # KnotTheory.jl is a weakdep (see ADR-0001, Project.toml). It is not in a
      # registry, so for CI we check it out as a sibling and dev it as a path
      # dep — Pkg.develop on a weakdep only sets its source path, it does NOT
      # promote it to a hard dep (Project.toml is unchanged). This exercises the
      # KnotTheoryExt extension tests while keeping standalone Pkg.add working.
      - name: Check out KnotTheory.jl weakdep for extension tests
        run: |
          git clone --depth 1 https://github.com/hyperpolymath/KnotTheory.jl.git ../KnotTheory.jl

      - name: Install, build, test
        run: |
          julia --project=. -e 'using Pkg; Pkg.develop(PackageSpec(path="../KnotTheory.jl")); Pkg.instantiate(); Pkg.build(); Pkg.test()'
