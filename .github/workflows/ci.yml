name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest]
        # macos-latest dropped 2026-06-19: macOS runner minutes exhausted -> ci.yml
        # startup_failure blocked merges; ubuntu covers the matrix. Restore when available.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3.3.0

      # KnotTheory.jl is a WEAKDEP (extension trigger) and is unregistered, so
      # it must be devved from its estate repo for the test target to resolve.
      # Pkg.develop only sets its source path; it does NOT promote it to a hard
      # dependency — Project.toml is unchanged. Skein itself installs and loads
      # standalone with no sibling checkouts.
      - name: Dev unregistered weakdep (KnotTheory.jl)
        run: git clone --depth 1 https://github.com/hyperpolymath/KnotTheory.jl.git ../KnotTheory.jl

      # No Manifest.toml is committed (packages pin compat, not manifests), so
      # each Julia version in the matrix resolves its own dependency graph.
      - name: Install, build, test
        run: |
          julia --project=. -e 'using Pkg; Pkg.develop(path="../KnotTheory.jl"); Pkg.instantiate(); Pkg.build(); Pkg.test()'
