name: BoJ Server Build Trigger
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          jq -n --arg repo "$REPOSITORY" --arg branch "$BRANCH_NAME" \
            '{repo: $repo, branch: $branch, engine: "casket"}' > "$RUNNER_TEMP/boj-request.json"
          curl --fail --show-error --max-time 20 -X POST \
            'http://boj-server.local:7700/cartridges/ssg-mcp/invoke' \
            -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/boj-request.json"
        continue-on-error: true
permissions:
  contents: read
