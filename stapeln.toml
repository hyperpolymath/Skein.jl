# SPDX-License-Identifier: MPL-2.0
# stapeln.toml — container build declaration for Skein.jl
#
# Skein.jl is a library, not a service: the only image this repo builds is the
# CI verification image defined in Containerfile (pinned Julia + the tests).
# There is no runtime deployment target and no binary entrypoint; anything that
# consumes Skein.jl does so from Julia, via Pkg.

[metadata]
name = "Skein.jl"
version = "0.4.0"
description = "Knot-theoretic database engine for Julia"
author = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"
license = "MPL-2.0"
registry = "ghcr.io/hyperpolymath"

[build]
containerfile = "Containerfile"
context = "."
runtime = "podman"

# ── Verification ──────────────────────────────────────────────
# The image's whole job is to run Pkg.test() inside a pinned environment
# (see .github/workflows/verification-image.yml, which runs it with
# --network=none so the pin is actually exercised).

[verify]
run-tests = true
network = "none"
